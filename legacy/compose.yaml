name: billwatchernext
services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: $POSTGRES_DB
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend]
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  # VersityGW puts an S3 API in front of the archive volume. The bytes stay on the same
  # POSIX volume with the same content-addressed layout, so the gateway can be added or removed
  # without migrating anything; it is what standard S3 tooling and off-host backup talk to.
  # Internal only: it is never published to the host and never reachable from the internet.
  blobs:
    image: versity/versitygw:v1.7.0
    command: ["--port", ":7070", "--iam-dir", "/iam", "posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: $S3_ACCESS_KEY_ID
      ROOT_SECRET_KEY: $S3_SECRET_ACCESS_KEY
    volumes:
      - blobs:/data
      - blob_iam:/iam
    healthcheck:
      test: ["CMD-SHELL", "versitygw --version >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [backend]
    logging: *logging

  migrate:
    build: .
    command: ["billwatcher", "migrate"]
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    networks: [backend]
    restart: "no"

  app:
    build: .
    command: ["billwatcher", "serve", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    depends_on:
      migrate: {condition: service_completed_successfully}
      blobs: {condition: service_started}
    volumes:
      # Still mounted read-only as a fallback when BLOB_STORAGE_BACKEND=filesystem.
      - blobs:/var/lib/billwatcher/blobs:ro
      # The file-first pipeline's store (PIPELINE_DATA_ROOT) *is* the record for the legislation
      # corpus, not a projection of the database (ADR-021). Read-only: the app serves the corpus
      # (ADR-018) and never writes it — the pipeline steps do, and they are run deliberately, not
      # by a long-lived service. Without this mount a corpus route would serve an empty store on a
      # container that is `read_only: true` anyway, which fails as a 404 rather than as an error.
      - pipeline_data:/var/lib/billwatcher/pipeline-data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    # TLS is terminated by a reverse proxy outside this stack (ADR-015), so the app is published
    # on the loopback interface for it to proxy to — not on 0.0.0.0, which would put an
    # unencrypted origin on the network. A proxy on another host needs that bind changed, and
    # then the port has to be firewalled deliberately.
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    networks: [backend, egress]
    logging: *logging
    read_only: true
    tmpfs: [/tmp]

  worker:
    build: .
    command: ["billwatcher", "worker"]
    env_file: .env
    depends_on:
      migrate: {condition: service_completed_successfully}
      blobs: {condition: service_started}
    volumes:
      - blobs:/var/lib/billwatcher/blobs
      # The audit tree (HANDOFF 27) is a derived projection, not the archive: losing this volume
      # loses nothing `audit-rebuild` cannot regenerate, so it is deliberately not in the backup
      # contract.
      - audit:/var/lib/billwatcher/audit
    restart: unless-stopped
    stop_grace_period: 30s
    # The worker crawls Parliament, so it needs outbound access. On an internal-only network it
    # would start, look healthy, and fail every fetch.
    networks: [backend, egress]
    logging: *logging

networks:
  # The database and the blob gateway are reachable only from the other containers, never from the
  # host and never from the internet.
  backend:
    internal: true
  # Outbound access. The worker cannot do its job without it — it crawls parlimen.gov.my — and the
  # app needs it only when RAG is enabled and has to reach an answer provider (ADR-009). The
  # database and gateway are deliberately not on this network.
  egress:

volumes:
  postgres_data:
  blobs:
  blob_iam:
  audit:
  # Unlike `audit`, this one is not rebuildable from anything in the stack: it holds the pipeline's
  # own listings, bills, documents and derived AKN/ELI files, and no service here writes it. A
  # deployment populates it with a deliberate one-shot run — `docker compose run --rm --volume
  # pipeline_data:/var/lib/billwatcher/pipeline-data app billwatcher pipeline …` — so it belongs in
  # the backup contract, and no service gets standing write access to it.
  pipeline_data:
