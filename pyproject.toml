[project]
name = "billwatchernext"
version = "0.2.0"
description = "Malaysian Parliament bills, downloaded as files, read into markdown, published as a graph"
readme = "README.md"
requires-python = ">=3.12.13,<3.14"
dependencies = [
  # The one network client, used by the download stage only.
  "httpx>=0.27",
  # Reads a PDF into positioned, font-bearing text runs. The geometry is the point: a marginal
  # note shares a baseline with the provision it annotates, so a flat-text reader splices them.
  "pdfminer.six>=20240706",
  # Declared alongside pydantic-settings, not left to it: the handoff answer contract
  # (`graph/handoff.py`) validates JSON written outside this codebase, which is a direct use.
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  # One graph, serialised to both JSON-LD and N-Quads, so the two cannot disagree (ADR-028).
  "rdflib>=7.1",
  "typer>=0.12",
  # Validates rendered Akoma Ntoso against the vendored OASIS schema before it is ever published.
  "xmlschema>=4.1",
]

[project.scripts]
billwatcher = "billwatcher.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  # Writes the synthetic PDFs the reading tests are run against. Test-only: nothing in `src`
  # constructs a PDF.
  "pypdf>=5.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billwatcher"]

[tool.ruff]
target-version = "py312"
line-length = 100
# `legacy/` is the Postgres-backed stack, frozen where it stood. It is not built, not imported and
# not maintained, so holding it to the current lint rules would only produce noise nobody acts on.
extend-exclude = ["legacy", "web", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# `typer.Option(...)` in a default is how Typer declares a CLI option; B008 is about mutable
# defaults, which these are not.
"src/billwatcher/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^legacy/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
  "live: opt-in, low-rate checks against the real Parliament site",
]
